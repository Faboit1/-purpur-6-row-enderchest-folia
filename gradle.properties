group = io.github.faboit1
version = 1.0.0

# Paper API used only for compilation. The plugin touches nothing newer than
# Bukkit 1.13 API, so the jar runs on every Paper/Folia/Canvas build from
# 1.21.4 up to current. Everything version-sensitive goes through reflection.
paperApiVersion = 1.21.8-R0.1-SNAPSHOT

org.gradle.caching = true
org.gradle.parallel = true
